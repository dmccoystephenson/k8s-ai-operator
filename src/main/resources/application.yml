spring:
  application:
    name: k8s-ai-operator

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

llm:
  provider: ${LLM_PROVIDER:bedrock}

aws:
  region: ${AWS_REGION:us-east-1}
  bedrock:
    model-id: ${BEDROCK_MODEL_ID:anthropic.claude-3-sonnet-20240229-v1:0}
    max-tokens: ${BEDROCK_MAX_TOKENS:512}
  dynamodb:
    table-name: ${DYNAMODB_TABLE:K8sAgentExecutions}
  cloudwatch:
    namespace: ${CLOUDWATCH_NAMESPACE:K8sAiOperator/Execution}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-sonnet-4-20250514}
  max-tokens: ${ANTHROPIC_MAX_TOKENS:512}

k8s:
  allowed-verbs: get,apply
  disallowed-verbs: delete,exec,scale,patch

# --- Usage reporting (trace) ---
# On start-up the operator sends ONE "startup" event to the trace usage-tracking service:
# the program name ("k8s-ai-operator"), its version, and the tag service=true. Nothing per
# request, and nothing about prompts, commands, clusters, users, hosts or addresses. Sent off
# the main thread; a trace server that is down or slow is a dropped report, never a failed
# start-up or a blocked request. Set USAGE_REPORTING_ENABLED=false (Helm:
# usageReporting.enabled=false) to turn it off; TRACE_USAGE_REPORTING=off or DO_NOT_TRACK=1
# also turn it off and win over this setting. The key is the write key issued to
# k8s-ai-operator; it can only add usage events and is not secret.
# Details: https://github.com/Stephenson-Software/trace#usage-reporting
usage-reporting:
  enabled: ${USAGE_REPORTING_ENABLED:true}
  endpoint: ${USAGE_REPORTING_ENDPOINT:https://trace.danielstephenson.dev}
  key: ${USAGE_REPORTING_KEY:f6dqdQ1rHFIPnFT_uUAZsXWfvQJVM8Q3RChj7GqUKGs}
  # The version tag; filled in from the Maven project version at build time.
  version: "@project.version@"
